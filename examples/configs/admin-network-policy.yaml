# AdminNetworkPolicy. Requires two workers, ANP CRD, and ANP enforcement.
# Replace worker-1/worker-2 and any site-specific values before running.

tft:
- name: AdminNetworkPolicy
  namespace: tft-docs
  test_cases: 32-34
  duration: 10
  connections:
  - name: traffic
    type: http
    instances: 1
    reverse: false
    server:
    - name: worker-1
    client:
    - name: worker-2
