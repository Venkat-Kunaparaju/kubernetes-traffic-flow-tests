# Default-network pod, host and Service suite. Requires two workers and NodePort access.
# Replace worker-1/worker-2 and any site-specific values before running.

tft:
- name: Default-network pod, host and Service suite
  namespace: tft-docs
  test_cases: 1-24,92-99
  duration: 10
  connections:
  - name: traffic
    type: iperf-tcp
    instances: 1
    reverse: false
    server:
    - name: worker-1
    client:
    - name: worker-2
