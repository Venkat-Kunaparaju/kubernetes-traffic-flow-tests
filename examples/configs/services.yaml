# Service traffic. Requires two Ready workers and working Service routing.
# Replace worker-1/worker-2 and any site-specific values before running.

tft:
- name: Service traffic
  namespace: tft-docs
  test_cases: 5,6,9,10,92,93
  duration: 10
  connections:
  - name: traffic
    type: iperf-tcp
    instances: 1
    reverse: false
    server:
    - name: worker-1
    client:
    - name: worker-2
