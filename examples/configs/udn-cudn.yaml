# UDN and CUDN traffic. Requires OVN-Kubernetes UDN support and two workers.
# Replace worker-1/worker-2 and any site-specific values before running.

tft:
- name: UDN and CUDN traffic
  namespace: tft-docs
  test_cases: 37,38
  duration: 10
  connections:
  - name: traffic
    type: iperf-tcp
    instances: 1
    reverse: false
    server:
    - name: worker-1
    client:
    - name: worker-2
