# First pod connectivity test. Requires two Ready worker nodes.
# Replace worker-1/worker-2 and any site-specific values before running.

tft:
- name: First pod connectivity test
  namespace: tft-docs
  test_cases: 1,2
  duration: 10
  connections:
  - name: traffic
    type: iperf-tcp
    instances: 1
    reverse: false
    server:
    - name: worker-1
    client:
    - name: worker-2
