# Basic pod networking. Requires two Ready workers; any CNI with pod networking.
# Replace worker-1/worker-2 and any site-specific values before running.

tft:
- name: Basic pod networking
  namespace: tft-docs
  test_cases: 1-4,13-16
  duration: 10
  connections:
  - name: traffic
    type: iperf-tcp
    instances: 1
    reverse: false
    server:
    - name: worker-1
    client:
    - name: worker-2
